version: '3.9'

services:
  # ──────────────────────────────────────────────────────────────
  # PostgreSQL Database
  # ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: reviewfunnel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reviewfunnel
      POSTGRES_PASSWORD: reviewfunnel_secret
      POSTGRES_DB: reviewfunnel_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reviewfunnel -d reviewfunnel_db']
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────────────
  # NestJS Backend API
  # ──────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reviewfunnel_api
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://reviewfunnel:reviewfunnel_secret@postgres:5432/reviewfunnel_db
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

volumes:
  postgres_data:
